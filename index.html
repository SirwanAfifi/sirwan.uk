<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F5F3EE">
    <meta name="description" content="Sirwan Afifi is a software engineer based in the UK. I build for the web, experiment with ideas, and occasionally disappear down technical rabbit holes.">
    <link rel="canonical" href="https://sirwan.uk/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&amp;family=Newsreader:ital,opsz,wght@1,6..72,400&amp;display=swap" rel="stylesheet">
    <title>Sirwan Afifi — Software engineer</title>
    <style>
      :root {
        color-scheme: light;
        --warm-white: #F5F3EE;
        --charcoal: #1F2933;
        --muted-navy: #243B53;
        --burnt-amber: #C17C3A;
        --background: var(--warm-white);
        --text: var(--charcoal);
        --muted: color-mix(in srgb, var(--muted-navy) 80%, var(--warm-white));
        --accent: var(--muted-navy);
        --accent-hover: var(--charcoal);
        --button-text: var(--warm-white);
        --font-sans: "Geist", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
        font-family: var(--font-sans);
        font-optical-sizing: auto;
        font-size: 100%;
        line-height: 1.6;
        background: var(--background);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }
      body {
        min-height: 100svh;
        margin: 0;
        padding: 0 clamp(1.25rem, 5vw, 5rem);
        display: flex;
        flex-direction: column;
      }
      a { color: inherit; }
      p { margin: 0; }

      .site-header,
      .site-footer {
        width: min(100%, 64rem);
        margin-inline: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .site-header { padding-block: 2rem; }
      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        min-height: 2.75rem;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .monogram {
        width: 2rem;
        height: 2rem;
        display: grid;
        place-items: center;
        border: 1px solid var(--burnt-amber);
        border-radius: 50%;
        background: var(--muted-navy);
        color: var(--warm-white);
        font: 600 1.2rem/1 var(--font-sans);
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-block: 2.25rem 3.5rem;
      }
      .profile {
        width: min(100%, 36rem);
      }
      .profile-content {
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin-bottom: 1rem;
        color: var(--muted-navy);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .eyebrow::before {
        content: "";
        width: 1.5rem;
        height: 2px;
        background: var(--burnt-amber);
      }
      h1 {
        margin: 0;
        font-size: clamp(3.5rem, 6vw, 4.5rem);
        font-weight: 680;
        letter-spacing: -0.04em;
        line-height: 0.95;
        text-wrap: balance;
      }
      .role { margin-top: 1rem; font-size: 1.25rem; font-weight: 500; }
      .location {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 0.375rem;
        color: var(--muted);
        font-size: 0.875rem;
        font-weight: 450;
      }
      .icon { width: 1.125rem; height: 1.125rem; flex: none; }
      .bio {
        max-width: min(100%, 38ch);
        margin-top: 2rem;
        color: var(--muted);
        font-family: var(--font-serif);
        font-size: clamp(1.25rem, 2vw, 1.375rem);
        font-style: italic;
        font-weight: 400;
        line-height: 1.55;
        text-wrap: pretty;
      }
      .now-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        min-height: 2.75rem;
        margin-top: 0.5rem;
        color: var(--muted-navy);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration-color: var(--burnt-amber);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.3em;
      }
      .now-link:hover { text-decoration-thickness: 2px; }
      .contact {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        max-width: 100%;
        min-height: 3rem;
        margin-top: 2rem;
        padding: 0.625rem 1.5rem;
        border: 1px solid transparent;
        border-radius: 0.4rem;
        background: var(--accent);
        color: var(--button-text);
        font-size: 1.0625rem;
        font-weight: 600;
        line-height: 1.4;
        text-decoration: none;
        transition: background-color 160ms ease, transform 160ms ease;
      }
      .contact:hover { background: var(--accent-hover); transform: translateY(-1px); }
      .social-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.25rem 1.5rem;
        width: 100%;
        margin-top: 1rem;
      }
      .social-links a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 2.75rem;
        color: var(--muted);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        text-underline-offset: 0.3em;
        transition: color 160ms ease;
      }
      .social-links a:hover { color: var(--muted-navy); text-decoration: underline; text-decoration-color: var(--burnt-amber); }
      a:focus-visible {
        outline: 3px solid var(--burnt-amber);
        outline-offset: 5px;
        border-radius: 0.25rem;
      }
      .site-footer {
        padding-block: 1rem 1.75rem;
        color: var(--muted);
        font-size: 0.875rem;
        font-weight: 450;
      }
      @media (max-width: 700px) {
        .site-header { padding-block: 1rem; }
        main { padding-block: 2rem 3rem; }
        .profile { max-width: 28rem; }
        h1 { font-size: clamp(2.5rem, 10vw, 3.5rem); }
        .site-footer { flex-wrap: wrap; gap: 0.3rem 1rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
        .contact:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="Sirwan Afifi, home">
        <span class="monogram" aria-hidden="true">S</span>
        sirwan.uk
      </a>
    </header>
    <main>
      <article class="profile" aria-labelledby="name">
        <div class="profile-content">
          <p class="eyebrow">Hello, I'm</p>
          <h1 id="name">Sirwan Afifi</h1>
          <p class="role">Software engineer</p>
          <p class="location">

            Based in the UK

          <p class="bio">I build for the web, experiment with ideas, and occasionally disappear down technical rabbit holes.</p>
          <a class="now-link" href="https://sirwan.info/now/">What I'm doing now <span aria-hidden="true">↗</span></a>
          <a class="contact" href="mailto:sir1afifi@gmail.com">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
            Get in touch
          </a>
          <nav class="social-links" aria-label="Find me online">

              GitHub

            <a href="https://www.linkedin.com/in/sirwan-a-73225345/" rel="me">
              <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 2H3.55C2.7 2 2 2.68 2 3.52v16.96c0 .84.7 1.52 1.55 1.52h16.9c.85 0 1.55-.68 1.55-1.52V3.52c0-.84-.7-1.52-1.55-1.52ZM7.93 18.75H4.97V9.2h2.96v9.55ZM6.45 7.9a1.72 1.72 0 1 1 0-3.44 1.72 1.72 0 0 1 0 3.44Zm12.3 10.85h-2.96V14.1c0-1.1-.02-2.53-1.54-2.53-1.54 0-1.78 1.2-1.78 2.45v4.73H9.51V9.2h2.84v1.3h.04c.4-.75 1.36-1.54 2.8-1.54 3 0 3.56 1.98 3.56 4.55v5.24Z"/></svg>
              LinkedIn
            </a>
          </nav>
        </div>
      </article>
    </main>
    <footer class="site-footer">
      <span>© Sirwan Afifi</span>
      <span>Made for the web. And the people on it.</span>
    </footer>
  </body>
</html>
