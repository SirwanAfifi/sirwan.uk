<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f4ef">
    <meta name="description" content="Sirwan Afifi is a software developer based in the UK.">
    <link rel="canonical" href="https://sirwan.uk/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Sirwan Afifi — Software developer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f6f4ef;
        color: #242821;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100svh;
        margin: 0;
      }

      .page {
        width: min(100% - 3rem, 1100px);
        min-height: 100svh;
        margin-inline: auto;
        display: flex;
        flex-direction: column;
      }

      header, footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        font: 500 0.82rem/1.4 Arial, Helvetica, sans-serif;
        letter-spacing: 0.03em;
      }

      header { padding-block: 2.5rem; }
      footer { padding-block: 2rem; border-top: 1px solid #d8d8cf; color: #666c62; }

      .domain { color: inherit; text-decoration: none; }
      .location { color: #666c62; }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-block: 5rem 8rem;
      }

      .eyebrow {
        margin: 0 0 1.5rem;
        color: #687068;
        font: 600 0.75rem/1.4 Arial, Helvetica, sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(4.4rem, 12vw, 10rem);
        font-weight: 400;
        letter-spacing: -0.075em;
        line-height: 0.94;
      }

      .intro {
        max-width: 35rem;
        margin: 2.5rem 0 0;
        color: #525950;
        font-size: clamp(1.25rem, 2.5vw, 1.7rem);
        line-height: 1.45;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem 2rem;
        margin-top: 3.5rem;
        font: 600 0.92rem/1.5 Arial, Helvetica, sans-serif;
      }

      nav a {
        color: #242821;
        text-decoration-color: #8b9688;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.35em;
      }

      a:hover { color: #557158; }
      a:focus-visible { outline: 2px solid #557158; outline-offset: 5px; }

      @media (max-width: 600px) {
        .page { width: min(100% - 2.5rem, 1100px); }
        header { padding-block: 1.6rem; }
        main { padding-block: 4rem 6rem; }
        h1 { font-size: clamp(4rem, 16vw, 7rem); }
        .intro { margin-top: 2rem; }
        nav { margin-top: 2.75rem; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="domain" href="/" aria-label="Sirwan Afifi, home">sirwan.uk</a>
        <span class="location">Based in the UK</span>
      </header>

      <main>
        <p class="eyebrow">Software developer</p>
        <h1>Sirwan<br>Afifi<span aria-hidden="true">.</span></h1>
        <p class="intro">I build software for the web and enjoy exploring new ideas along the way.</p>
        <nav aria-label="Find me online">
          <a href="mailto:sir1afifi@gmail.com">Email ↗</a>
          <a href="https://github.com/SirwanAfifi">GitHub ↗</a>
          <a href="https://www.linkedin.com/in/sirwan-a-73225345/">LinkedIn ↗</a>
        </nav>
      </main>

      <footer>
        <span>© Sirwan Afifi</span>
        <span>A small corner of the web.</span>
      </footer>
    </div>
  </body>
</html>
